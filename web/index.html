<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Picks">
  <title>Registro de Picks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="vista" id="vista-inicio" data-vista="inicio"></main>
  <main class="vista" id="vista-apuestas" data-vista="apuestas"></main>
  <main class="vista" id="vista-analisis" data-vista="analisis"></main>
  <main class="vista" id="vista-banca" data-vista="banca"></main>
  <main class="vista" id="vista-ajustes" data-vista="ajustes"></main>

  <button class="fab" id="fab" aria-label="Registrar apuesta" data-accion="registrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
    <span class="tabbar__indicador" id="indicador"></span>
    <button class="tabbar__tab" data-ir="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tabbar__tab" data-ir="apuestas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Apuestas</button>
    <button class="tabbar__tab" data-ir="analisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="m8 14 3-4 3 2 4-6"/></svg>Análisis</button>
    <button class="tabbar__tab" data-ir="banca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Banca</button>
    <button class="tabbar__tab" data-ir="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
  </nav>

  <div class="velo" id="velo"></div>
  <section class="hoja" id="hoja" role="dialog" aria-modal="true"></section>
  <div class="velo velo--dialogo" id="velo-dialogo"></div>
  <section class="hoja hoja--dialogo" id="hoja-dialogo" role="dialog" aria-modal="true"></section>
  <div class="banner-demo" id="banner-demo" hidden><span>Modo demo · datos de ejemplo</span><a href="./">Salir</a></div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/datos_demo.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/dialogos.js"></script>
  <script src="js/graficas.js"></script>
  <script src="js/liquidar.js"></script>
  <script src="js/hoja_apuesta.js"></script>
  <script src="js/hoja_detalle.js"></script>
  <script src="js/vista_inicio.js"></script>
  <script src="js/vista_apuestas.js"></script>
  <script src="js/vista_analisis.js"></script>
  <script src="js/vista_banca.js"></script>
  <script src="js/vista_ajustes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
